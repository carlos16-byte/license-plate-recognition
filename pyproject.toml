[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpr"
version = "0.1.0"
description = "Sistema modular de reconocimiento de placas vehiculares y rostros (CV clasica, ML y Deep Learning)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["lpr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
